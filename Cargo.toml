[package]
# ★ The bare name `nami-core` on crates.io is NOT ours — it belongs to
# water-rs (https://github.com/water-rs/nami, "a reactive framework"), the same
# org that owns `mado`. Measured 2026-08-08: their 0.3.2 exposes only
# `default`/`std`, so a consumer flipped to the bare name fails on unknown
# features rather than on the name, which is the confusing way to find this out.
#
# So the PACKAGE is published as `pleme-nami-core` while `[lib] name` stays
# `nami_core`: every `use nami_core::…` across the fleet is untouched, and a
# consumer renames at its own manifest with
# `nami-core = { package = "pleme-nami-core", … }`. Same shape magma uses for
# `magma-core`.
name = "pleme-nami-core"
version = "0.1.15"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "Shared browser core — HTML parsing, CSS cascade, layout, DOM, networking"
repository = "https://github.com/pleme-io/nami-core"

[lib]
# Keep the import path `nami_core` regardless of the published package name.
name = "nami_core"
path = "src/lib.rs"

[features]
default = ["lisp"]
network = ["dep:todoku"]
config = ["dep:shikumi"]
# Programmable DOM transforms authored as tatara-lisp forms.
lisp = ["dep:tatara-lisp"]
# Layer 3 of the React-in-Lisp arc: real Lisp evaluator via
# pleme-io's tatara-eval. Enables conditionals, arithmetic, string
# ops, and lambdas inside templates / agent logic.
eval = ["lisp", "dep:tatara-eval"]
# Tree-sitter source-language parsing. JSX/TSX today; Vue/Svelte
# queued. Each grammar compiles C via `cc`, so this feature adds
# real compile time — off by default.
ts = ["dep:tree-sitter", "dep:tree-sitter-typescript", "dep:tree-sitter-svelte-next"]
# WASM/WASI agent host — sandboxed execution of precompiled modules
# with capability-gated access. Foundation for Lisp-authored scrapers
# that ship as .wasm. Heavier compile cost — opt-in.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasi-common"]
# Ed25519 signatures for (defextension) bundles — connects the
# browser-extension store to pleme-io's sekiban/tameshi attestation
# chain. Off by default because most runtime paths don't need it.
signatures = ["dep:ed25519-dalek", "dep:base64", "dep:curve25519-dalek"]
# The rendering-pipeline test vocabulary (`nami_core::testkit`). Pure,
# GPU-free fluent domain assertions over the CSS → layout → paint
# pipeline (Probe / StyleAssert / LayoutAssert / PaintAssert). Dev/test
# ONLY — feature-gated so it carries zero production-closure weight; a
# consumer's dev-deps enable `nami-core/testkit`, never a build.
testkit = []
# GPU rasterization of a `DisplayList` → RGBA (`nami_core::gpu`). The ONE
# shared `DrawCmd → (QuadInstance, TextRun)` translator that mado + namimado
# both consume, replacing their duplicated render loops. Off by default so
# nami-core stays GPU-free for pure consumers; garasu has zero nami-core dep,
# so pulling it here creates no cycle.
gpu = ["dep:garasu", "dep:glyphon", "dep:wgpu", "dep:ishou-tokens"]

[dependencies]
html5ever = "0.29"
markup5ever = "0.14"
lightningcss = { version = "1.0.0-alpha", default-features = false, features = ["visitor"] }
taffy = "0.7"
todoku = { version = "0.1", optional = true }
shikumi = { version = "0.1", optional = true }
# Canonical published crate from pleme-io/tatara-lisp. The derive macros are
# re-exported by the lib itself (`DeriveTataraDomain` / `DeriveKeywordSexp`) and
# exact-pinned there, so a consumer must NEVER name `tatara-lisp-derive` — doing
# so is what let the two halves drift apart.
tatara-lisp = { version = "0.3.3", optional = true }
# NOT the same crate as tatara-lisp-eval, and deliberately still git-pinned to
# the retired pleme-io/tatara. Its API (non-generic `Interpreter`,
# `Value::{Attrs, Builtin}`, `String`-backed atoms) diverges from
# tatara-lisp-eval's (`Interpreter<H>`, `Value::{Map, NativeFn}`, `Arc<str>`),
# and it also pulls tatara-nix, which has no counterpart in tatara-lisp. Moving
# the `eval` feature over is a rewrite of `eval`/`inline_lisp`, not a version
# bump — tracked separately. The graph carries both tatara-lisp majors happily
# because no nami-core type crosses between them.
tatara-eval = { version = "0.2", optional = true }
url = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
# Content-addressable snapshots. Same BLAKE3 convention as tameshi.
blake3 = "1.8"
# Optional regex support for (deffind) and future DSLs that want
# pattern-matching against live page text.
regex = "1"
# Compiled RegexSet DFA for blocker URL matching — one DFA pass over
# all tracker domain patterns instead of an O(specs×domains) substring
# scan. nami-core is hayai's first real fleet consumer.
hayai = "0.1"
# Source-language parsing (JSX/TSX/Vue/Svelte). Feature-gated.
tree-sitter = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-svelte-next = { version = "0.1", optional = true }
# WASM/WASI sandboxed agent host.
wasmtime = { version = "38", optional = true, default-features = false, features = ["cranelift"] }
wasmtime-wasi = { version = "38", optional = true }
wasi-common = { version = "38", optional = true }
# Ed25519 signing — battle-tested, audited, no_std-compatible.
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std", "rand_core"] }
# Pulled in transitively by ed25519-dalek. Explicit pin with the
# zeroize feature is REQUIRED so feature unification gives Scalar
# the DefaultIsZeroes impl that ed25519-dalek::hazmat needs —
# otherwise nix builds (where some transitive forces zeroize on
# ed25519-dalek via default-features) fail with E0599 "the method
# zeroize exists for struct Scalar, but its trait bounds were not
# satisfied". Pinned to 4.1.3 (latest compatible with our Rust
# 1.89.0 / crates.io graph).
curve25519-dalek = { version = "4.1.3", optional = true, default-features = false, features = ["zeroize"] }
# Base64 encoding for pubkeys + signatures in manifest form.
base64 = { version = "0.22", optional = true }
# RFC 6238 TOTP — HMAC-SHA1/256/512 on a shared secret.
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# ── GPU translator deps (feature `gpu`) — the shared DisplayList→RGBA
# rasterizer both mado + namimado consume. Versions MUST match the consumers
# (mado pins garasu 4883ee7, glyphon 0.9, wgpu 25, ishou-tokens[wgpu]) so the
# graph unifies to one garasu/glyphon/wgpu. ──
#
# ★ CRATES.IO, NOT A GIT REV — and that is what kills the split-rev class.
#
# This was `git = …, rev = a2afc2a`, and the rev had to move in lockstep
# with mado's or the graph got TWO garasu (a git source and a different git
# source never unify), making every cross-crate `GpuContext` an "expected
# garasu::context::GpuContext, found GpuContext" mismatch. Measured
# 2026-07-31.
#
# A semver range has no such failure mode: cargo unifies compatible
# versions from one source automatically, so no consumer has to know what
# any other consumer pinned. The rev pin was only ever a workaround for
# garasu being unpublished; it is published (auto-release), so the
# workaround can go.
garasu = { version = "0.1", optional = true }
glyphon = { version = "0.9", optional = true }
wgpu = { version = "25", optional = true }
ishou-tokens = { version = "0.1", features = ["wgpu"], optional = true }

[dev-dependencies]
# Property-based testing — fuzzes parsers + invariants across
# randomly generated inputs. dev-only, adds no runtime cost.
proptest = "1"
# Microbenchmarks for storage + hot-path primitives.
criterion = { version = "0.7", default-features = false, features = ["rayon"] }
# RNG for generating test keypairs.
rand = "0.8"
# Compile WAT (WebAssembly text format) inline in tests — lets us
# verify WASM host behavior against small handwritten modules
# without needing to ship binary blobs.
wat = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "storage_kv"
harness = false
path = "benches/storage_kv.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[lints.clippy]
pedantic = "warn"
